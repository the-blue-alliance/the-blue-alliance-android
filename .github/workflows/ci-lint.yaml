name: CI — Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Build jobs only read the repo; never hand third-party build code a write token.
permissions:
  contents: read

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails if gradle/wrapper/gradle-wrapper.jar isn't an official Gradle release.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run ktlint
        run: ./gradlew ktlintCheck --stacktrace

  android-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Create CI google-services.json
        run: |
          mkdir -p app/src/debug app/src/release wear/src/debug wear/src/release tv/src/debug tv/src/release
          for pkg in \
            "com.thebluealliance.androidclient.development:app/src/debug" \
            "com.thebluealliance.androidclient:app/src/release" \
            "com.thebluealliance.androidclient.development:wear/src/debug" \
            "com.thebluealliance.androidclient:wear/src/release" \
            "com.thebluealliance.androidclient.development:tv/src/debug" \
            "com.thebluealliance.androidclient:tv/src/release"; do
            IFS=: read -r package dir <<< "$pkg"
            cat > "$dir/google-services.json" << EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "$package" }
              },
              "oauth_client": [{ "client_id": "000000000000-ci.apps.googleusercontent.com", "client_type": 3 }],
              "api_key": [{ "current_key": "ci-placeholder-key" }]
            }],
            "configuration_version": "1"
          }
          EOF
          done
      - name: Run Android Lint
        run: ./gradlew :app:lintDebug :wear:lintDebug :tv:lintDebug --stacktrace
